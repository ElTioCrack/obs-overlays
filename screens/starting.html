<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Empezamos pronto</title><link rel="stylesheet" href="../shared/base.css?v=5"><link rel="stylesheet" href="../shared/screen.css?v=5"><style>@media (orientation:portrait){.hero{display:contents}.hero .title{order:1}.hero .sub{order:2;margin-top:-2vmin}.cd{order:3}.cards{order:4}}</style></head><body><div class="stage" id="stage"><div class="ui"><div class="top" id="topbar"></div><div class="center"><div class="hero"><h1 class="title" id="ttl"></h1><div class="sub" id="sub"></div><div class="cards" id="cds"></div></div><div class="cd" id="cd"><svg viewBox="0 0 100 100"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2d0"/><stop offset=".5" stop-color="#e8b968"/><stop offset="1" stop-color="#b9863a"/></linearGradient></defs><circle class="tks" cx="50" cy="50" r="46"/><circle class="trk" cx="50" cy="50" r="49"/><circle class="prg" id="prg" cx="50" cy="50" r="49" pathLength="1"/></svg><i class="orbit"></i><i class="orbit o2"></i><div class="in"><div class="num" id="num"></div><div class="lbl" id="lbl"></div></div></div></div><div class="bottom"><span class="tag" id="tag"></span><div class="tk" id="tk"></div></div></div></div><script src="../shared/base.js?v=5"></script><script src="../shared/screen.js?v=5"></script><script>stageBg(stage);startFx();brandTop(topbar,"Directo de hoy");st.textContent="EMPEZAMOS PRONTO";tag.textContent="EN BREVE";splitTitle(ttl,P("title","Empezamos pronto"),P("accent","pronto"));sub.textContent=P("sub","Prepárate · coge sitio · saluda en el chat");lbl.textContent="para empezar";
cards(cds,[{k:"game",label:"Hoy jugamos",value:P("game","Fortnite")},{k:"clock",label:"Duración",value:P("dur","3 horas aprox.")},{k:"bell",label:"No te lo pierdas",values:["Sígueme para avisos","Activa la campanita","Comparte el directo"]},{k:"star",label:P("goalLabel","Meta de seguidores"),value:P("goal","40 / 100"),bar:+P("goalP",.4)}]);
ticker(tk,P("msgs","Bienvenidos al directo|Saluda en el chat mientras empezamos|Deja tu like para que llegue a más gente|Sígueme: "+NAME).split("|"));
const tot=P("min",5)*60000,ea=+P("endAt",0),end=ea>Date.now()-600000?ea:Date.now()+tot;let last=-1,boom=false;const t=()=>{const r=Math.max(0,Math.ceil((end-Date.now())/1000));prg.style.strokeDashoffset=1-Math.max(0,(end-Date.now())/tot);if(r===last)return;last=r;roll(num,pad(r/60|0)+":"+pad(r%60));if(r<=10&&r>0){cd.classList.add("final");FX.burst(innerWidth/2,innerHeight/2,14)}if(r===0&&!boom){boom=true;cd.classList.remove("final");lbl.textContent="¡ya!";FX.burst(innerWidth/2,innerHeight/2,220);splitTitle(ttl,P("go","¡Empezamos!"),"Empezamos")}};t();setInterval(t,200)</script></body></html>
