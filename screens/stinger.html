<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Transicion</title><link rel="stylesheet" href="../shared/base.css?v=3"><style>.bar{position:fixed;left:0;right:0;height:50.5%;background:#000;transform:scaleY(0)}.top{top:0;transform-origin:top}.bot{bottom:0;transform-origin:bottom}.gl{position:fixed;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--gold);transform:scaleX(0)}</style></head><body><i class="bar top" id="a"></i><i class="bar bot" id="b"></i><i class="gl" id="g"></i><script src="../shared/base.js?v=3"></script><script>const run=async()=>{const o={duration:300,easing:EASE.in,fill:"both"};a.animate([{transform:"scaleY(0)"},{transform:"scaleY(1)"}],o);await b.animate([{transform:"scaleY(0)"},{transform:"scaleY(1)"}],o).finished;await g.animate([{transform:"scaleX(0)"},{transform:"scaleX(1)",offset:.6},{transform:"scaleX(1)",opacity:0}],{duration:420,easing:EASE.out,fill:"both"}).finished;const p={duration:300,easing:EASE.out,fill:"both"};a.animate([{transform:"scaleY(1)"},{transform:"scaleY(0)"}],p);await b.animate([{transform:"scaleY(1)"},{transform:"scaleY(0)"}],p).finished;g.getAnimations().forEach(x=>x.cancel())};run();if(P("loop","1")=="1")setInterval(run,3000)</script></body></html>
