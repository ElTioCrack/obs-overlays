<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Fondo</title><link rel="stylesheet" href="../shared/base.css?v=3"><style>body{background:#000}canvas{position:fixed;inset:0;width:100%;height:100%}</style></head><body><canvas id="cv"></canvas><script src="../shared/base.js?v=3"></script><script>const x=cv.getContext("2d");let W,H,dpr=1;const fit=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};fit();addEventListener("resize",fit);const G=46;let t0=performance.now(),raf;const draw=t=>{const s=(t-t0)/1000;x.fillStyle="#000";x.fillRect(0,0,W,H);const off=(s*4)%G;const wave=((s%10)/10)*(W+H)*1.4-(W+H)*.2;for(let y=-G;y<H+G;y+=G)for(let X=-G;X<W+G;X+=G){const px=X+off,py=y+off*.5;const d=Math.abs((px+py)-wave);const g=Math.max(0,1-d/220);x.fillStyle=g>0.02?`rgba(212,162,78,${.12+g*.35})`:"rgba(192,192,192,.12)";x.beginPath();x.arc(px,py,1.3+g*.8,0,6.283);x.fill()}if(!LOW)raf=requestAnimationFrame(draw)};raf=requestAnimationFrame(draw);document.addEventListener("visibilitychange",()=>{if(document.hidden)cancelAnimationFrame(raf);else raf=requestAnimationFrame(draw)})</script></body></html>
