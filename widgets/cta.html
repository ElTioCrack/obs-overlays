<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Llamados a la accion</title><link rel="stylesheet" href="../shared/base.css?v=3"><style>body{padding:20px}.pill{position:relative;overflow:hidden}.u{position:absolute;left:18px;right:18px;bottom:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left}.u.go{animation:flash 900ms var(--ease-out)}@keyframes flash{0%{transform:scaleX(0)}50%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}</style></head><body><div class="pill in"><span class="dot gold"></span><span id="c"></span><i class="u" id="u"></i></div><script src="../shared/base.js?v=3"></script><script>const L=P("texts","Sígueme|Deja un like|Comparte el directo").split("|"),S=+P("sec",6)*1000;let i=0;const go=async()=>{if(c.textContent)await leave(c,{to:"translateY(-10px)"});c.textContent=L[i++%L.length];await enter(c,{from:"translateY(14px)"});setTimeout(()=>replay(u,"go"),S-1300)};go();setInterval(go,S)</script></body></html>
