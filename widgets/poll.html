<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Encuesta</title><link rel="stylesheet" href="../shared/base.css?v=3"><style>body{padding:24px}.p{width:540px;padding:22px 24px}h3{margin:0 0 8px;font-size:28px;font-weight:600;letter-spacing:-.01em}.o{margin-top:10px;font-size:20px;padding:10px 12px;border:1px solid transparent;border-radius:10px;transition:border-color .4s var(--ease-out)}.o.win{border-color:rgba(212,162,78,.6)}.o .top{display:flex;justify-content:space-between;margin-bottom:8px}.o b{font-weight:600}.o.win b{color:var(--color-accent-strong)}.bar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:rgba(255,255,255,.55);transform-origin:left;transform:scaleX(var(--p));animation:grow 1s var(--ease-num) both}.o.win .bar i{background:var(--gold)}</style></head><body><div class="p card in"><h3 id="q"></h3><div id="o"></div></div><script src="../shared/base.js?v=3"></script><script>q.textContent=P("q","¿Qué juego mañana?");const ops=P("opts","Fortnite:55|Minecraft:30|GTA:15").split("|").map(x=>x.split(":"));const max=Math.max(...ops.map(x=>+x[1]));o.innerHTML=ops.map(([a,b],k)=>`<div class="o" data-v="${b}"><div class="top"><span>${a}</span><b>${b}%</b></div><div class="bar"><i style="--p:${b/100};animation-delay:${200+k*60}ms"></i></div></div>`).join("");setTimeout(()=>{const w=[...o.children].find(e=>+e.dataset.v===max);w.classList.add("win");bump(w)},1400)</script></body></html>
