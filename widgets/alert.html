<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Alerta</title><link rel="stylesheet" href="../shared/base.css?v=3"><style>body{display:grid;place-items:center}#st{position:relative;display:grid;place-items:center}.a{text-align:center;opacity:0}.a .label{color:var(--color-secondary)}.a b{display:block;font-size:52px;font-weight:700;letter-spacing:-.02em;margin-top:12px}.a small{display:block;font-size:24px;color:var(--color-text-muted);margin-top:6px}.a svg{display:block;width:180px;height:2px;margin:16px auto 0;overflow:visible}.a line{stroke:var(--color-accent);stroke-width:2;stroke-dasharray:180;stroke-dashoffset:180}.a.big b{font-size:68px}.a .seal{display:inline-block;padding:.3em .7em;border:1px solid var(--color-accent);border-radius:999px;color:var(--color-accent);font:var(--label);letter-spacing:.22em;margin-bottom:10px}</style></head><body><div id="st"></div><script src="../shared/base.js?v=3"></script><script>const TIER={follow:{label:"Nuevo seguidor",hold:1500,seal:"NUEVO"},small:{label:"Regalo",hold:1800},medium:{label:"Regalo",hold:2600,shimmer:true},big:{label:"Mega regalo",hold:3600,shimmer:true,big:true}};function alertFn(kind,user,extra){return async()=>{const T=TIER[kind]||TIER.follow;const a=document.createElement("div");a.className="a shadow"+(T.big?" big":"");a.innerHTML=(T.seal?`<span class="seal">${T.seal}</span><br>`:"")+`<span class="label">${T.label}</span><b>${user}</b>`+(extra?`<small>${extra}</small>`:"")+`<svg viewBox="0 0 180 2"><line x1="0" y1="1" x2="180" y2="1"/></svg>`;st.append(a);a.style.opacity=1;const ln=a.querySelector("line");ln.animate([{strokeDashoffset:180},{strokeDashoffset:0}],{duration:600,easing:EASE.out,fill:"both"});if(T.seal)enter(a.querySelector(".seal"),{from:"scale(.6)",e:EASE.back,d:450});await enter(a.querySelector("b"),{from:"translateY(24px) scale(.96)",delay:120,e:T.big?EASE.out:EASE.back,d:T.big?800:450});if(T.shimmer){const b=a.querySelector("b");b.classList.add("gold-text");shimmer(b)}await sleep(T.hold);await leave(a);a.remove()}}window.alertQ=(k,u,x)=>enqueue(alertFn(k,u,x));const user=P("user","alguien");if(P("demo","0")=="1"){const D=[["follow",user],["small",user,"Rosa ×5"],["medium",user,"León ×1"],["big",user,"Universo ×1"]];let i=0;const go=()=>{const d=D[i++%D.length];alertQ(...d)};go();setInterval(go,7000)}else if(Q.get("kind"))alertQ(P("kind","follow"),user,P("extra",""))</script></body></html>
