<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Lower third</title><link rel="stylesheet" href="../shared/base.css?v=3"><style>body{padding:30px}.lt b{display:block;font-size:44px;font-weight:700;letter-spacing:-.02em}.lt span{display:block;font-size:22px;color:var(--color-secondary);margin-top:6px}.lt .rule{width:56px;margin:0 0 14px}</style></head><body><div class="lt shadow" id="lt"><i class="rule" id="ru"></i><b id="t"></b><span id="s"></span></div><script src="../shared/base.js?v=3"></script><script>t.textContent=P("title","el_tio_crack");s.textContent=P("sub","Jugando ahora: Fortnite");const hold=+P("hold",8)*1000;const show=async()=>{lt.style.opacity=1;ru.animate([{transform:"scaleX(0)"},{transform:"scaleX(1)"}],{duration:600,easing:EASE.out,fill:"both"});enter(t,{from:"translateY(100%)",delay:200});await enter(s,{from:"translateY(10px)",delay:260});await sleep(hold);leave(t,{to:"translateX(-24px)"});leave(s,{to:"translateX(-24px)"});await ru.animate([{transform:"scaleX(1)"},{transform:"scaleX(0)"}],{duration:300,delay:120,easing:EASE.in,fill:"both"}).finished};show();if(P("loop","1")=="1")setInterval(show,hold+6000)</script></body></html>
