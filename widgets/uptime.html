<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Tiempo en vivo</title><link rel="stylesheet" href="../shared/base.css?v=3"><style>body{padding:20px}</style></head><body><div class="pill in"><span class="dot live"></span><span id="u"></span></div><script src="../shared/base.js?v=3"></script><script>const s=Date.now()-(+P("start",0))*1000;let gold=false;const tick=()=>{const t=(Date.now()-s)/1000|0;roll(u,pad(t/3600|0)+":"+pad(t/60%60|0)+":"+pad(t%60));if(t>=3600&&!gold){gold=true;u.classList.add("gold-text");shimmer(u)}};tick();setInterval(tick,1000)</script></body></html>
