<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Ticker</title><link rel="stylesheet" href="../shared/base.css?v=3"><style>.t{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:14px 0;white-space:nowrap;font-size:26px;overflow:hidden}.t .row{display:inline-block;will-change:transform}.t .sep{color:var(--color-accent);margin:0 .9em;animation:pulse 3s var(--ease-idle) infinite}</style></head><body><div class="t"><span class="row" id="row"></span></div><script src="../shared/base.js?v=3"></script><script>const items=P("text","Bienvenidos al directo|Sígueme para más|Gracias por el apoyo").split("|");const seg=items.map(x=>`<span>${x}</span><span class="sep">/</span>`).join("");row.innerHTML=seg.repeat(6);requestAnimationFrame(()=>{const w=row.scrollWidth/6,sp=+P("speed",75);row.animate([{transform:"translate3d(0,0,0)"},{transform:`translate3d(${-w}px,0,0)`}],{duration:w/sp*1000,iterations:Infinity})})</script></body></html>
