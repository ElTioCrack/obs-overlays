<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Recordatorio seguir</title><link rel="stylesheet" href="../shared/base.css?v=3"><style>body{display:flex;align-items:flex-end;padding:30px}.p{display:flex;align-items:center;gap:14px;padding:10px 24px 10px 10px;border-radius:999px;font-size:24px;opacity:0}.p .ic{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#000;display:grid;place-items:center}.p svg{width:20px;height:20px}.p em{font-style:normal;font-weight:700;position:relative}.p em::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left}.p.on em::after{animation:grow 600ms 500ms var(--ease-out) forwards}@keyframes grow{to{transform:scaleX(1)}}</style></head><body><div class="p card" id="p"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span><em>SÍGUEME</em> · <span id="n"></span></span></div><script src="../shared/base.js?v=3"></script><script>n.textContent=P("name","el_tio_crack");const go=async()=>{p.style.opacity=1;p.classList.remove("on");void p.offsetWidth;p.classList.add("on");await enter(p,{from:"translateX(-24px)"});await sleep(+P("hold",5)*1000);await leave(p,{to:"translateX(-24px)"})};go();setInterval(go,+P("every",600)*1000)</script></body></html>
