<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Borde lienzo</title><link rel="stylesheet" href="../shared/base.css?v=3"><style>.b{position:fixed;inset:14px;border:1px solid var(--line);border-radius:24px;animation:fade 800ms var(--ease-out) both}.b::before,.b::after{content:"";position:absolute;width:60px;height:60px;border:2px solid var(--a);animation:draw 700ms 300ms var(--ease-out) both}.b::before{top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:24px;transform-origin:top left}.b::after{bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:24px;transform-origin:bottom right}@keyframes draw{from{transform:scale(0)}}@keyframes fade{from{opacity:0}}.b.pulse{animation:bp 900ms var(--ease-out)}@keyframes bp{30%{border-color:rgba(212,162,78,.7)}}</style></head><body><div class="b" id="b"></div><script src="../shared/base.js?v=3"></script><script>window.pulse=()=>replay(b,"pulse")</script></body></html>
