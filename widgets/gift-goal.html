<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Meta de regalos</title><link rel="stylesheet" href="../shared/base.css?v=3"><style>body{padding:20px}.g{width:520px;padding:18px 22px}.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.top b{font-size:28px;font-weight:600}.bar{position:relative;height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}.bar i{position:absolute;inset:0;background:var(--gold);transform-origin:left;transform:scaleX(var(--p,0));transition:transform 900ms var(--ease-num)}.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);animation:sweep 2.4s 1.2s var(--ease-idle) infinite}@keyframes sweep{60%,100%{transform:translateX(100%)}}.done{margin-left:10px;color:var(--color-accent)}</style></head><body><div class="g card in"><div class="top"><span class="label"><span id="lab"></span><span class="done" id="done" hidden>· META</span></span><b><span id="num">0</span> / <span id="tot"></span></b></div><div class="bar"><i id="f"></i></div></div><script src="../shared/base.js?v=3"></script><script>const goal=+P("goal",1000);let v=+P("value",650);lab.textContent=P("label","Meta de monedas");tot.textContent=goal.toLocaleString("es");const set=x=>{v=x;countTo(num,v);requestAnimationFrame(()=>f.style.setProperty("--p",Math.min(1,v/goal)));if(v>=goal&&done.hidden){done.hidden=false;enter(done,{from:"translateY(8px)",e:EASE.back});setTimeout(()=>{num.classList.add("gold-text");shimmer(num)},900)}};setTimeout(()=>set(v),200);window.set=set</script></body></html>
