<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Ultimos eventos</title><link rel="stylesheet" href="../shared/base.css?v=3"><style>body{padding:20px}.r{display:grid;gap:8px;width:440px}.r>div{display:flex;align-items:center;gap:14px;padding:14px 20px;font-size:22px}.r .label{flex:1}.r b{font-weight:600}.r .dot{transition:opacity 1.2s var(--ease-idle)}.r .dot.off{opacity:0}</style></head><body><div class="r" id="r"></div><script src="../shared/base.js?v=3"></script><script>const rows=[["Último seguidor",P("follower","alguien")],["Top regalo",P("gifter","otro_crack")]];rows.forEach(([k,v],i)=>{const d=document.createElement("div");d.className="card";d.innerHTML=`<span class="dot gold"></span><span class="label">${k}</span><b>${v}</b>`;r.append(d);enter(d,{from:"translateX(28px)",delay:i*60})});setTimeout(()=>r.querySelectorAll(".dot").forEach(d=>d.classList.add("off")),4000)</script></body></html>
