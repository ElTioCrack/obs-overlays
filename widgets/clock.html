<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Reloj</title><link rel="stylesheet" href="../shared/base.css?v=3"><style>body{padding:20px}.pill{font-size:30px}.sep{animation:pulse 2s var(--ease-idle) infinite}</style></head><body><div class="pill in"><span id="h"></span><span class="sep">:</span><span id="m"></span></div><script src="../shared/base.js?v=3"></script><script>const t=()=>{const d=new Date();roll(h,pad(d.getHours()));roll(m,pad(d.getMinutes()))};t();setInterval(t,1000)</script></body></html>
